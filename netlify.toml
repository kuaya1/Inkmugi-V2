[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ──────────────────────────────────────────────────────────────────
# HTTPS + non-www canonicalisation.
# Google selected https://inkmugi.com as canonical — all variants 301
# here. Verified working in production; do not weaken.
# ──────────────────────────────────────────────────────────────────
[[redirects]]
  from = "http://inkmugi.com/*"
  to   = "https://inkmugi.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.inkmugi.com/*"
  to   = "https://inkmugi.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.inkmugi.com/*"
  to   = "https://inkmugi.com/:splat"
  status = 301
  force  = true

# ──────────────────────────────────────────────────────────────────
# Booking.
#
# /booking used to be a React route that returned HTTP 200, rendered a
# spinner, and then moved the browser to Vagaro from a useEffect — a page
# that existed only to redirect. Internal CTAs now link straight to Vagaro,
# and this rule keeps any external or bookmarked /booking link working as a
# real HTTP redirect rather than a client-side one.
# ──────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/booking"
  to   = "https://www.vagaro.com/inkmugi"
  status = 301
  force  = true

# ──────────────────────────────────────────────────────────────────
# 301 Redirects — legacy URLs → canonical routes
# ──────────────────────────────────────────────────────────────────

# Legacy HTML extensions
[[redirects]]
  from = "/services.html"
  to   = "/services"
  status = 301
  force  = true

[[redirects]]
  from = "/gallery.html"
  to   = "/gallery"
  status = 301
  force  = true

[[redirects]]
  from = "/contact.html"
  to   = "/contact"
  status = 301
  force  = true

[[redirects]]
  from = "/blog.html"
  to   = "/blog"
  status = 301
  force  = true

[[redirects]]
  from = "/faq.html"
  to   = "/faq"
  status = 301
  force  = true

[[redirects]]
  from = "/about.html"
  to   = "/about"
  status = 301
  force  = true

[[redirects]]
  from = "/old-gallery-page.html"
  to   = "/gallery"
  status = 301
  force  = true

# Short / legacy service URL → canonical
[[redirects]]
  from = "/ombre-brows"
  to   = "/signature-ombre-brows"
  status = 301
  force  = true

# Old location page → current URL
[[redirects]]
  from = "/permanent-makeup-annandale-va"
  to   = "/licensed-pmu-artist-annandale"
  status = 301
  force  = true

# Legacy blog paths
[[redirects]]
  from = "/blog/healing-process-old-post"
  to   = "/permanent-makeup-safety-dmv"
  status = 301
  force  = true

[[redirects]]
  from = "/blog/post-about-pricing"
  to   = "/services"
  status = 301
  force  = true

[[redirects]]
  from = "/services/microblading"
  to   = "/services"
  status = 301
  force  = true

[[redirects]]
  from = "/services/ombre-powder-brows"
  to   = "/services"
  status = 301
  force  = true

# ──────────────────────────────────────────────────────────────────
# NOTE: there is deliberately no `/* -> /index.html 200` SPA fallback.
#
# That rule was why every unknown URL — /reviews, /pmu-safety-statistics,
# a typo, a nonexistent blog slug — answered HTTP 200 with the empty app
# shell, and why Netlify's own 404 handling could never fire. Every public
# route is now prerendered to its own document at build time, so unmatched
# paths fall through to dist/404.html and get a real HTTP 404.
#
# The consequence: a route that fails to prerender would 404 in production.
# scripts/prerender.mjs fails the build rather than let that ship.
# ──────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────
# Response headers
#
# The blanket `X-Robots-Tag = "index, follow"` that used to sit here is
# gone: it applied to every response including the 404 page, contradicting
# the noindex those pages emit. Indexability is declared once, per page, in
# src/components/SEO.tsx.
# ──────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options    = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy    = "strict-origin-when-cross-origin"
    Cache-Control      = "public, max-age=0, must-revalidate"

# Fingerprinted build output is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ──────────────────────────────────────────────────────────────────
# Build post-processing
# ──────────────────────────────────────────────────────────────────
[build.processing]
  skip_processing = false

# ──────────────────────────────────────────────────────────────────
# Pretty URLs OFF.
#
# With it on, Netlify 301s /about -> /about/ to normalise directory
# paths. That was harmless for a client-rendered SPA serving one
# index.html, but now every route is its own prerendered directory, so
# it meant: every URL in sitemap.xml redirected, every crawlable
# internal <a href="/about"> redirected, and the document that finally
# answered at /about/ declared its canonical as /about — a URL that
# redirects. Verified in production before changing this.
#
# Off, Netlify's asset server still resolves /about to
# dist/about/index.html and answers 200 directly, which is what the
# canonicals and the sitemap already claim.
# ──────────────────────────────────────────────────────────────────
[build.processing.html]
  pretty_urls = false

    <!-- Font Loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

    <!--
      Title, description, canonical, robots, Open Graph and JSON-LD are emitted
      per route by src/components/SEO.tsx and baked in at the marker below by
      scripts/prerender.mjs.

      Nothing SEO-relevant is declared statically in this shell on purpose. A
      static tag here is repeated on all ~70 routes and cannot be overridden per
      page — that is precisely how the shell ended up asserting "index, follow"
      on the 404 page while React injected "noindex", and how one business
      entity graph ended up duplicated onto every blog article.
    -->
    <!--seo-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Analytics (deferred) -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var gaScript = document.createElement('script');
          gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-CCPGNTS653';
          gaScript.async = true;
          document.head.appendChild(gaScript);
          gaScript.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-CCPGNTS653');
          };
        }, 2000);
      });
    </script>
  </body>
</html>
